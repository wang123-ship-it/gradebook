<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>703 班級報到站</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
:root{--bg:#f4f1ea;--card:#fff;--ink:#2b2a33;--mut:#7a7787;--pri:#3b7dd8;--ok:#2e9e6b;--okbg:#dff5e9;--late:#e67e22;--latebg:#fdebd3;--bad:#d9534f;--line:#e2ddd0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;touch-action:manipulation}
body{display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;gap:14px;padding:10px 18px;background:#fff;border-bottom:2px solid var(--line)}
#clock{font-size:40px;font-weight:800;font-variant-numeric:tabular-nums;min-width:130px}
#dateTxt{font-size:18px;color:var(--mut);line-height:1.3}
nav{display:flex;gap:6px;margin-left:auto;align-items:center;overflow-x:auto}
nav button{font-size:20px;font-weight:700;padding:12px 13px;border:0;border-radius:16px;background:#ece8dc;color:var(--ink);min-height:60px;white-space:nowrap;flex-shrink:0}
nav .mv{display:flex;gap:4px;background:#fff3c4;border-radius:20px;padding:4px;flex-shrink:0}
nav .arr{background:#fff;min-width:54px;padding:12px 8px}nav .arr.ok{background:var(--ok);color:#fff}nav .arr:disabled{opacity:.3}
nav button.on{background:var(--pri);color:#fff}
#sync{width:12px;height:12px;border-radius:50%;background:#bbb}
#sync.ok{background:var(--ok)}
main{flex:1;overflow:auto;padding:14px 18px;-webkit-overflow-scrolling:touch}
.panel{display:none}.panel.on{display:block}
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.stat{font-size:24px;font-weight:800}
.stat small{font-size:16px;color:var(--mut);font-weight:500;margin-left:6px}
.chip{display:inline-flex;align-items:center;justify-content:center;font-size:21px;font-weight:700;padding:12px 20px;min-height:56px;border-radius:28px;border:2px solid var(--line);background:#fff;color:var(--ink)}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
.btn{font-size:22px;font-weight:700;padding:14px 24px;min-height:60px;border:0;border-radius:16px;background:var(--pri);color:#fff}
.btn.gray{background:#ddd8ca;color:var(--ink)}.btn.red{background:var(--bad)}.btn.green{background:var(--ok)}
.btn:active,.chip:active,.tile:active,.cell:active{transform:scale(.96)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{position:relative;min-height:92px;border-radius:18px;border:3px solid var(--line);background:#fff;padding:8px 6px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:26px;font-weight:800}
.tile .no{font-size:15px;color:var(--mut);font-weight:600}
.tile .tm{font-size:17px;font-weight:700;margin-top:2px}
.tile.abs{background:#eee6f8;border-color:#8e5bd1}
.tile.in{background:var(--okbg);border-color:var(--ok)}
.tile.late{background:var(--latebg);border-color:var(--late)}
.tile.late .tm{color:var(--late)}
.tile.in .tm{color:var(--ok)}
.tile .seq{position:absolute;top:4px;right:8px;font-size:14px;color:var(--mut);font-weight:700}
.tile .medal{position:absolute;top:2px;left:6px;font-size:20px}
.hwwrap{}
table.hw{border-collapse:separate;border-spacing:4px;width:100%}
.hwcols{display:flex;gap:10px;align-items:flex-start}.hwcols>div{flex:1;min-width:0}
table.hw th{position:sticky;top:0;z-index:3;background:var(--bg);font-size:16px;font-weight:700;padding:2px;vertical-align:bottom;line-height:1.2}
table.hw th .chip.fin{min-height:34px;padding:2px 14px;font-size:15px;margin-top:2px}
table.hw th .sub{display:block;font-size:12px;color:var(--mut);font-weight:500}
table.hw td.nm{font-size:22px;font-weight:800;white-space:nowrap;padding:0 10px;height:56px;background:#fff;border-radius:8px;min-width:140px;width:1%}
table.hw td.nm small.aw{font-size:12px;margin:0 0 0 3px;color:#c0392b}
table.hw .cell{height:56px;min-width:84px;font-size:24px;border-width:3px;border-radius:12px;line-height:1;padding:0}
table.hw td{padding:0;line-height:1}
#hwFilter .chip{min-height:44px;padding:4px 16px;font-size:18px}
#hwFilter{gap:6px}
table.hw .cell.nw{background:#fde2e2;border-color:#d9534f;color:#b02a2a;font-size:16px;font-weight:800}
table.hw td.nm small{color:var(--mut);font-weight:600;font-size:13px;margin-right:6px}
table.hw tr.sq td.sqc{background:#dfe9f8;border-radius:8px;text-align:center;font-size:16px;font-weight:800;padding:0 4px;height:30px}
table.hw tr.sq td.sqh{background:#dfe9f8;border-radius:8px;font-size:16px;font-weight:800;padding:0 10px;height:30px}
.cell{height:68px;min-width:92px;border-radius:14px;border:3px solid var(--line);background:#fff;font-size:30px;font-weight:800;color:#c9c5b8;width:100%}
.cell.y{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.cell.absent{background:#eee;color:#bbb}
.nodata{padding:50px;text-align:center;color:var(--mut);font-size:22px}
.modal{position:fixed;inset:0;background:rgba(30,28,40,.55);display:none;align-items:center;justify-content:center;z-index:50}
.modal.on{display:flex}
.box{background:#fff;border-radius:24px;padding:24px;max-width:92vw;max-height:90vh;overflow:auto;min-width:420px}
.box h2{margin:0 0 14px;font-size:28px}
.pad{display:grid;grid-template-columns:repeat(3,92px);gap:10px;justify-content:center}
.pad button{height:80px;font-size:34px;font-weight:800;border:0;border-radius:18px;background:#ece8dc}
#pinDots{text-align:center;font-size:44px;letter-spacing:12px;height:60px;margin-bottom:8px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#2b2a33;color:#fff;padding:14px 24px;border-radius:30px;font-size:22px;display:none;z-index:60;align-items:center;gap:16px}
.toast.on{display:flex}
.toast button{background:#fff;color:#2b2a33;border:0;border-radius:18px;padding:8px 18px;font-size:18px;font-weight:700}
.sec{background:#fff;border-radius:18px;padding:16px;margin-bottom:14px}
.sec h3{margin:0 0 10px;font-size:22px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
input.txt{font-size:22px;padding:12px 14px;border:2px solid var(--line);border-radius:12px;min-width:260px;user-select:text;-webkit-user-select:text}
.tasklist .it{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:20px}
.tasklist .it b{flex:1}
.tool{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:900px){.tool{grid-template-columns:1fr}}
#pick{font-size:72px;font-weight:900;text-align:center;min-height:110px;line-height:110px;color:var(--pri)}
#tcount{font-size:96px;font-weight:900;text-align:center;font-variant-numeric:tabular-nums;line-height:1.1}
#tcount.end{color:var(--bad)}
.sqbtns{display:flex;gap:6px;flex-wrap:wrap}
.sqbtns .chip{min-height:48px;padding:8px 16px;font-size:20px}
button.tile.done{cursor:default}button.tile.done:active{transform:none}
.bkday{margin-bottom:18px}.bkday h3{margin:0 0 8px;font-size:32px;font-weight:900}.bkday h3 small{color:var(--mut);font-weight:700;font-size:24px;margin-left:10px}
.bkgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.bkrow{background:#fff;border:3px solid var(--line);border-radius:18px;padding:8px 16px 10px}
.bkhd{display:flex;align-items:center;gap:10px}
.bs{font-size:36px;font-weight:900}
.bty{font-size:25px;font-weight:800;padding:1px 14px;border-radius:12px;color:#fff;white-space:nowrap}
.bnt{display:block;font-size:36px;font-weight:800;line-height:1.25;overflow-wrap:anywhere;min-height:44px;margin-top:2px}
.bkdiary{position:sticky;bottom:0;margin-top:10px;background:#fff3c4;border:3px solid #e6c34a;border-radius:18px;padding:12px 22px;font-size:34px;font-weight:800}.bkdiary b{color:var(--bad)}.bkdiary small{font-size:22px;color:var(--mut);margin-left:14px;font-weight:600}.bkdiary.off{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.nchip{display:inline-flex;align-items:center;gap:2px;background:#f4f1ea;border:2px solid var(--line);border-radius:22px;padding:4px 6px 4px 14px;font-size:22px}.nchip button{border:0;background:#fff;border-radius:10px;min-width:44px;min-height:44px;font-size:18px;font-weight:700;margin-left:2px}
.ttl{display:inline-block;padding:2px 12px;border-radius:12px;cursor:pointer;border:2px dashed var(--line)}.ttl.foc{background:var(--pri);color:#fff;border-style:solid;border-color:var(--pri)}
.fin{min-height:40px;padding:4px 14px;font-size:16px;margin-top:4px}
.mini{font-size:20px;font-weight:800;margin-left:8px;padding:8px 14px;min-height:52px;border:0;border-radius:12px;background:var(--ok);color:#fff}
.mini.lv{background:#8e5bd1}.mini:disabled{opacity:.25}
.lt h3{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.lt h3 .seal{margin-left:auto;min-height:48px;font-size:18px;padding:6px 16px}
.dn{margin-top:8px;color:var(--mut);font-size:18px}.dnb{font-size:18px;margin:3px;padding:6px 12px;border:2px solid var(--line);border-radius:12px;background:#f4f1ea;color:var(--mut)}
table.st{border-collapse:collapse;width:100%;background:#fff;border-radius:14px;overflow:hidden;font-size:24px}
table.st th{background:#dfe9f8;padding:8px 6px;font-size:18px}table.st td{padding:6px 8px;text-align:center;border-top:1px solid var(--line);font-weight:700}
table.st td.n{text-align:left;font-weight:800;white-space:nowrap}table.st td.z{color:#c9c5b8;font-weight:500}table.st td.w{color:var(--late)}table.st td.r{color:var(--bad)}
.hrow{padding:10px 0;border-bottom:1px solid var(--line);font-size:20px}.hrow b{font-size:24px}
.lt{background:#fff;border:3px solid var(--late);border-radius:18px;padding:14px;margin-bottom:12px}
.lt h3{margin:0 0 10px;font-size:24px}.lt h3 small{color:var(--late);font-size:18px;margin-left:8px}
.nm2{display:inline-block;margin:4px;padding:10px 16px;border-radius:14px;background:var(--latebg);font-size:26px;font-weight:800}
.nm2 small{font-size:14px;color:var(--mut);margin-left:4px}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:70}
</style>
</head>
<body>
<header>
  <div id="clock">--:--</div>
  <div id="dateTxt"></div>
  <span id="sync" title="連線狀態"></span><span id="ver" style="font-size:12px;color:var(--mut);writing-mode:horizontal-tb">v10-29e</span>
  <nav id="nav"></nav>
</header>
<main>
  <!-- 報到 -->
  <section class="panel on" id="p-checkin">
    <div class="bar">
      <div class="stat" id="stIn">已到 0<small>/ 0</small></div>
      <div class="stat" id="stLate" style="color:var(--late)"></div>
      <div class="stat" id="stWait" style="font-size:18px;color:var(--mut);font-weight:600"></div>
    </div>
    <div class="grid" id="gCheck"></div>
  </section>
  <!-- 收作業 -->
  <section class="panel" id="p-hw">
    <div class="bar" id="hwFilter"></div>
    <div class="hwwrap" id="hwBody"></div>
  </section>
  <section class="panel" id="p-book"></section>
  <section class="panel" id="p-cadre"></section>
  <section class="panel" id="p-late"></section>
  <section class="panel" id="p-stat"></section>
  <!-- 小工具 -->
  <section class="panel" id="p-tools">
    <div class="tool">
      <div class="sec">
        <h3>🎯 隨機點名</h3>
        <div class="row" style="margin-bottom:8px">
          <button class="chip on" id="pkIn">只抽已到的</button>
          <button class="chip" id="pkNo">不重複</button>
        </div>
        <div id="pick">？</div>
        <button class="btn" style="width:100%;font-size:30px;min-height:76px" id="pkGo">抽！</button>
      </div>
      <div class="sec">
        <h3>⏱ 倒數計時</h3>
        <div id="tcount">05:00</div>
        <div class="row" style="justify-content:center;margin:10px 0">
          <button class="chip" data-m="1">1分</button><button class="chip on" data-m="5">5分</button>
          <button class="chip" data-m="10">10分</button><button class="chip" data-m="15">15分</button>
          <button class="chip" data-m="30">30分</button>
        </div>
        <div class="row" style="justify-content:center">
          <button class="btn green" id="tGo">開始</button><button class="btn gray" id="tRst">重設</button>
        </div>
      </div>
    </div>
  </section>
  <!-- 老師 -->
  <section class="panel" id="p-admin"><div id="adminBody"></div></section>
</main>

<div class="modal" id="mPin"><div class="box" style="min-width:380px">
  <h2 id="pinTitle" style="text-align:center">輸入老師密碼</h2>
  <div id="pinDots"></div>
  <div class="pad" id="pinPad"></div>
  <div class="row" style="justify-content:center;margin-top:14px"><button class="btn gray" id="pinCancel">取消</button></div>
</div></div>
<div class="toast" id="toast"><span id="toastTxt"></span></div>
<div class="modal" id="mYN" style="z-index:80"><div class="box" style="text-align:center;min-width:480px">
  <div id="ynT" style="font-size:34px;font-weight:900"></div>
  <div id="ynS" style="font-size:22px;color:var(--mut);margin:12px 0 22px;line-height:1.5"></div>
  <div class="row" style="justify-content:center;gap:18px">
    <button class="btn gray" id="ynNo" style="font-size:30px;min-width:180px;min-height:88px">取消</button>
    <button class="btn green" id="ynYes" style="font-size:30px;min-width:180px;min-height:88px">✔ 確定</button>
  </div></div></div>
<div class="modal" id="mHist" style="z-index:70"><div class="box" style="width:92vw;max-width:1000px">
  <div class="row" style="justify-content:space-between;margin-bottom:10px"><h2 style="margin:0">📚 歷史作業（已封存）</h2><button class="btn gray" id="histClose">關閉</button></div>
  <div id="histBody"></div></div></div>
<div class="modal" id="mMk" style="z-index:55"><div class="box" style="min-width:520px"><div id="mkBody"></div></div></div>
<div class="modal" id="mBk" style="z-index:70"><div class="box" style="width:94vw;max-width:1200px;background:#f4f1ea">
  <div class="row" style="justify-content:space-between;margin-bottom:10px"><h2 style="margin:0">🗓 近 7 天聯絡簿</h2><span class="row"><button class="btn" id="bk7Img">📷 存成圖片</button><button class="btn gray" id="bk7Close">關閉</button></span></div>
  <div id="bk7Body"></div></div></div>
<div class="modal" id="mDet" style="z-index:70"><div class="box" style="width:90vw;max-width:820px">
  <div class="row" style="justify-content:space-between;margin-bottom:10px"><h2 id="detT" style="margin:0"></h2><button class="btn gray" id="detClose">關閉</button></div>
  <div id="detBody" style="font-size:20px;line-height:1.7"></div></div></div>
<div class="modal" id="mCf"><div class="box" style="text-align:center;min-width:460px">
  <div style="font-size:24px;color:var(--mut)">要報到的是</div>
  <div id="cfName" style="font-size:60px;font-weight:900;margin:6px 0"></div>
  <div id="cfSub" style="font-size:22px;color:var(--mut);margin-bottom:20px"></div>
  <div class="row" style="justify-content:center;gap:18px">
    <button class="btn gray" id="cfNo" style="font-size:30px;min-width:180px;min-height:88px">取消</button>
    <button class="btn green" id="cfYes" style="font-size:30px;min-width:180px;min-height:88px">✔ 確定</button>
  </div></div></div>
<canvas id="confetti"></canvas>

<script>
firebase.initializeApp({
  apiKey:"AIzaSyArjsk22SiVdkdzvySSgwkCDFBKrPp_MMM",
  authDomain:"class-book-red-703.firebaseapp.com",
  databaseURL:"https://class-book-red-703-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:"class-book-red-703"
});
const db=firebase.database();
const $=s=>document.querySelector(s);
const SUBJ=["國","英","數","自","地","歷","公","其他"];
const TYPES=["作業","訂正","寫成績","帶物品","提醒"],EXAMS=["小考","大卷"];
function isExam(t){return t.type==="小考"||t.type==="大卷"||t.type==="考試"}
function noCol(t){return isExam(t)||t.type==="寫成績"||t.type==="帶物品"||t.type==="提醒"}
const pad2=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
const todayKey=()=>ymd(new Date());
const WD=['日','一','二','三','四','五','六'];
function nextSchoolDay(from){const d=new Date(from||Date.now());do{d.setDate(d.getDate()+1)}while(d.getDay()==0||d.getDay()==6);return ymd(d)}
function prevSchoolDay(){const d=new Date();do{d.setDate(d.getDate()-1)}while(d.getDay()==0||d.getDay()==6);return ymd(d)}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

let status={},collect={},absn={},hwFocus=null,allAtt={};
let students=[],settings={lateTime:'07:40',squadCount:6},squads={},att={},tasks={},checks={};
let hwSquad='all',hwMode='all',picked=new Set(),pickIn=true,pickNoRep=false;
let unlocked=false,curDay=todayKey();

/* ---------- 資料監聽 ---------- */
db.ref('students').on('value',s=>{
  const v=s.val()||{};
  students=Object.keys(v).map(k=>({key:k,no:+v[k].no||0,name:v[k].name||'',arch:!!v[k].archived})).filter(x=>!x.arch&&x.name).sort((a,b)=>a.no-b.no);
  renderAll();
});
db.ref('kiosk/settings').on('value',s=>{settings=Object.assign({lateTime:'07:40',squadCount:6},s.val()||{});renderAll()});
db.ref('kiosk/squads').on('value',s=>{squads=s.val()||{};renderAll()});
db.ref('kiosk/tasks').on('value',s=>{tasks=s.val()||{};renderAll()});
db.ref('kiosk/attendance').on('value',s=>{allAtt=s.val()||{};renderStat()});
db.ref('kiosk/status').on('value',s=>{status=s.val()||{};renderLate();renderStat();if(unlocked&&curTab==='admin')renderAdmin()});
db.ref('kiosk/collect').on('value',s=>{collect=s.val()||{};renderHw();renderLate();renderStat()});
db.ref('kiosk/checks').on('value',s=>{checks=s.val()||{};renderHw();if(unlocked)renderAdmin()});
let attRef=null;
function watchAtt(){
  if(attRef)attRef.off();
  curDay=todayKey();
  attRef=db.ref('kiosk/attendance/'+curDay);
  attRef.on('value',s=>{const v=s.val()||{};att={};absn={};Object.keys(v).forEach(k=>{v[k]&&v[k].st?absn[k]=v[k]:att[k]=v[k]});renderCheckin();renderHw();if(unlocked)renderAdmin()});
}
watchAtt();
db.ref('.info/connected').on('value',s=>$('#sync').classList.toggle('ok',!!s.val()));

/* ---------- 時鐘 ---------- */
function tick(){
  const d=new Date();
  $('#clock').textContent=pad2(d.getHours())+':'+pad2(d.getMinutes());
  $('#dateTxt').innerHTML=(d.getMonth()+1)+'月'+d.getDate()+'日<br>星期'+WD[d.getDay()];
  if(ymd(d)!==curDay){watchAtt();renderAll()}
}
setInterval(tick,5000);tick();

/* ---------- 分頁 ---------- */
const TABS={checkin:'🌅 報到',hw:'📚 收作業',book:'📒 聯絡簿',cadre:'🧑‍✈️ 幹部',late:'⚠️ 遲交',stat:'📊 統計',tools:'🎲 小工具',admin:'🔒 老師'};
const DEF_ORDER=['checkin','book','cadre','hw','late','stat','tools','admin'];
let curTab='checkin',moveTab=null,lpFlag=false,lpTimer=null;
function tabOrder(){const o=(Array.isArray(settings.tabOrder)?settings.tabOrder.slice():[]).filter((t,i,a)=>TABS[t]&&a.indexOf(t)===i);DEF_ORDER.forEach(t=>{if(!o.includes(t))o.push(t)});return o}
function renderNav(){
  const o=tabOrder();let h='';
  o.forEach((t,i)=>{
    if(moveTab===t)h+=`<span class="mv"><button class="arr" data-mv="-1" ${i==0?'disabled':''}>◀</button><button class="on" data-tab="${t}">${TABS[t]}</button><button class="arr" data-mv="1" ${i==o.length-1?'disabled':''}>▶</button><button class="arr ok" data-mvdone="1">✓</button></span>`;
    else h+=`<button data-tab="${t}" class="${curTab===t?'on':''}">${TABS[t]}</button>`;
  });
  const nav=$('#nav');nav.innerHTML=h;

/* ---------- PIN ---------- */
async function sha(s){
  try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('703kiosk:'+s));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('')}
  catch(e){let h=5381;for(const ch of '703kiosk:'+s)h=((h<<5)+h+ch.charCodeAt(0))>>>0;return 'x'+h}
}
let pinBuf='',pinCb=null,pinMode='enter',pinFirst='';
function askPin(cb,mode){
  pinCb=cb;pinBuf='';pinFirst='';
  pinMode=mode||(settings.pinHash?'enter':'new');
  $('#pinTitle').textContent=pinMode==='enter'?'輸入老師密碼':'設定 4 位數密碼';
  drawPin();$('#mPin').classList.add('on');
}
function drawPin(){$('#pinDots').textContent='●'.repeat(pinBuf.length)+'○'.repeat(Math.max(0,4-pinBuf.length))}

$('#pinPad').querySelectorAll('button').forEach(b=>b.onclick=async()=>{
  const k=b.dataset.k;
  if(k==='⌫'){pinBuf=pinBuf.slice(0,-1);drawPin();return}
  if(k!=='OK'){if(pinBuf.length<4)pinBuf+=k;drawPin();if(pinBuf.length<4)return}
  if(pinBuf.length<4)return;
  if(pinMode==='enter'){
    if(await sha(pinBuf)===settings.pinHash){unlocked=true;closePin();pinCb&&pinCb()}
    else{$('#pinTitle').textContent='密碼錯誤，再試一次';pinBuf='';drawPin()}
  }else if(pinMode==='new'||pinMode==='change'){
    pinFirst=pinBuf;pinBuf='';pinMode='confirm';$('#pinTitle').textContent='再輸入一次確認';drawPin();
  }else if(pinMode==='confirm'){
    if(pinBuf===pinFirst){await db.ref('kiosk/settings/pinHash').set(await sha(pinBuf));unlocked=true;closePin();toast('密碼已設定');pinCb&&pinCb()}
    else{pinMode='new';pinBuf='';pinFirst='';$('#pinTitle').textContent='兩次不同，重新設定';drawPin()}
  }
});

let statMode='since',statCF='',statCT='',statSort='no';
function dayAgo(n){const d=new Date();d.setDate(d.getDate()-n);return ymd(d)}
function mondayOf(){const d=new Date(),w=(d.getDay()+6)%7;d.setDate(d.getDate()-w);return ymd(d)}
function statRange(){
  const td=todayKey();
  if(statMode==='today')return [td,td];
  if(statMode==='d3')return [dayAgo(2),td];
  if(statMode==='week')return [mondayOf(),td];
  if(statMode==='month')return [td.slice(0,8)+'01',td];
  if(statMode==='custom')return [statCF||'0000-00-00',statCT||'9999-12-31'];
  if(statMode==='all')return ['0000-00-00','9999-12-31'];
  return [settings.statFrom||'0000-00-00',td];
}
function statCompute(){
  const [from,to]=statRange(),td=todayKey(),c={};
  students.forEach(s=>c[s.key]={arr:0,late:0,leave:0,pub:0,none:0,hl:0,hm:0,hv:0,pend:0,dLate:[],dNone:[],dLeave:[],hw:[]});
  const days=Object.keys(allAtt).filter(d=>d>=from&&d<=to&&Object.values(allAtt[d]||{}).filter(r=>r&&!r.st).length>=3).sort();
  days.forEach(d=>students.forEach(s=>{
    const r=(allAtt[d]||{})[s.key],x=c[s.key];
    if(!r){if(d<td||true){x.none++;x.dNone.push(d)}return}
    if(r.st){r.st==='public'?x.pub++:x.leave++;x.dLeave.push(d+(r.st==='public'?'（公假）':'（請假）'));return}
    x.arr++;const l=r.l!==undefined?!!r.l:isLate(r.t);if(l){x.late++;x.dLate.push(d+' '+r.t)}
  }));
  Object.keys(status).forEach(tid=>Object.keys(status[tid]||{}).forEach(k=>{
    const r=status[tid][k],x=c[k];if(!x||!r||((checks[tid]||{})[k]&&r.s!=='nw')||r.d<from||r.d>to)return;
    if(r.s==='nw'){x.hm+=2;x.hw.push({d:r.d,nm:'聯絡簿（未寫札記，記2次）',s:'miss'});return}
    if(r.s==='late')x.hl++;else if(r.s==='miss')x.hm++;else if(r.s==='leave')x.hv++;else return;
    x.hw.push({d:r.d,nm:tasks[tid]?tLabel(tasks[tid]):'聯絡簿',s:r.s});
  }));
  if(to>=td)openTasks().filter(t=>t.due&&(t.due<td||collect[t.id])).forEach(t=>students.forEach(s=>{if(!(checks[t.id]||{})[s.key]&&!stOf(t.id,s.key))c[s.key].pend++}));
  return {c,days,from,to};
}

  $('#mkBody').innerHTML=`<h2>${esc(s.name)}（${s.no}號）</h2>
    <div class="row" style="margin-bottom:14px"><button class="btn green" data-mkact="now">✔ 現在補報到 ${now}</button></div>
    <div class="row" style="margin-bottom:14px">指定時間：<input type="time" id="mkTime" class="txt" value="${now}" style="min-width:0"><button class="btn" data-mkact="time">確定補報到</button></div>
    <div class="row"><button class="chip" data-mkact="leave">請假</button><button class="chip" data-mkact="public">公假</button>${absn[k]?'<button class="chip" data-mkact="clear">取消請假紀錄</button>':''}<button class="btn gray" data-mkact="close">關閉</button></div>`;
  $('#mMk').classList.add('on');
  $('#mkBody').querySelectorAll('[data-mkact]').forEach(b=>b.onclick=()=>{
    const a=b.dataset.mkact,r=db.ref('kiosk/attendance/'+curDay+'/'+k);
    if(a==='close'){$('#mMk').classList.remove('on');return}
    if(a==='now'){const dd=new Date();{const tt=pad2(dd.getHours())+':'+pad2(dd.getMinutes());r.set({t:tt,ts:dd.getTime(),m:1,l:isLate(tt)?1:0})}}
    else if(a==='time'){const v=$('#mkTime').value;if(!v)return;r.set({t:v,ts:new Date(todayKey()+'T'+v+':00').getTime(),m:1,l:isLate(v)?1:0})}
    else if(a==='leave'||a==='public')r.set({st:a,ts:Date.now(),m:1});
    else if(a==='clear')r.remove();
    $('#mMk').classList.remove('on');toast(s.name+' 已登記');
  });
}
function renderAdmin(){
  if(!unlocked||curTab!=='admin'){return}
  if(document.activeElement&&document.activeElement.id==='noteNew')return;
  const T=Object.keys(tasks).map(id=>Object.assign({id},tasks[id])).filter(t=>!(t.closed||t.sealed)).sort((a,b)=>b.createdAt-a.createdAt);
  const inList=students.filter(s=>att[s.key]);
  $('#adminBody').innerHTML=`
  <div class="sec"><h3>📋 項目管理（重開收作業／刪除；新增請到「幹部」，封存在「遲交」）</h3><div class="tasklist">${collect['lj_'+todayKey()]&&!tasks['lj_'+todayKey()]?`<div class="it"><b>📔 聯絡簿（今天） <small style="color:var(--mut);font-weight:500">已收畢</small></b><button class="chip" data-reopen="lj_${todayKey()}">重開收作業</button></div>`:''}${T.length?T.map(t=>{
    const done=students.filter(s=>(checks[t.id]||{})[s.key]).length;
    return `<div class="it"><b>${esc(t.subj)}${esc(t.type)} <small style="color:var(--mut);font-weight:500">${esc(t.note||'')} 交${(t.due||'').slice(5)}　${done}/${students.length}${collect[t.id]?'　（已收畢）':''}</small></b>
    ${collect[t.id]?`<button class="chip" data-reopen="${t.id}">重開收作業</button>`:''}<button class="chip" data-del="${t.id}" style="color:var(--bad)">刪除</button></div>`}).join(''):'<div class="nodata" style="padding:14px">尚無項目</div>'}</div></div>
  <div class="sec"><h3>📝 備註選項（幹部新增作業時的快速按鈕）</h3>
    <div class="row" style="margin-bottom:10px">${noteList().map((v,i)=>`<span class="nchip"><b>${esc(v)}</b><button data-nl="${i}">◀</button><button data-nr="${i}">▶</button><button data-nx="${i}" style="color:var(--bad)">✕</button></span>`).join('')}</div>
    <div class="row"><input class="txt" id="noteNew" placeholder="輸入新的備註，例如：國典" style="min-width:280px"><button class="btn green" id="noteAdd">＋ 新增備註</button><button class="btn gray" id="noteReset">還原預設</button></div>
  </div>
  <div class="sec"><h3>🕒 補報到／請假登記（學生太晚到、看板已收起時用）</h3>
    <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(130px,1fr))">${students.filter(s=>!att[s.key]).map(s=>`<button class="tile ${absn[s.key]?'abs':''}" style="min-height:72px;font-size:21px" data-mk="${s.key}"><span class="no">${s.no}</span>${esc(s.name)}${absn[s.key]?`<span class="tm" style="font-size:14px;color:#8e5bd1">${absn[s.key].st==='public'?'公假':'請假'}</span>`:''}</button>`).join('')||'<span style="color:var(--mut)">全班都已報到 🎉</span>'}</div></div>
  <div class="sec"><h3>🛠 更正報到（點一下，再按一次確認取消該生報到）</h3>
    <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(120px,1fr))">${inList.length?inList.map(s=>`<button class="tile in" style="min-height:64px;font-size:20px" data-unin="${s.key}">${esc(s.name)}<span class="tm" style="font-size:14px">${att[s.key].t}</span></button>`).join(''):'<span style="color:var(--mut)">今天還沒有人報到</span>'}</div></div>
  <div class="sec"><h3>👥 排別設定（先點學生，再點排別）</h3>
    <div class="row" style="margin-bottom:8px">排數：
      <button class="chip" id="sqMinus">－</button><b style="font-size:24px">${settings.squadCount}</b><button class="chip" id="sqPlus">＋</button></div>
    <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(130px,1fr))">${students.map(s=>`<button class="tile ${assignSel===s.key?'in':''}" style="min-height:72px;font-size:21px" data-as="${s.key}"><span class="no">${s.no}・${sqOf(s.key)?'第'+sqOf(s.key)+'排':'未分'}</span>${esc(s.name)}</button>`).join('')}</div>
    <div class="sqbtns" style="margin-top:10px">${assignSel?Array.from({length:settings.squadCount},(_,i)=>`<button class="chip" data-sqset="${i+1}">第${i+1}排</button>`).join('')+'<button class="chip" data-sqset="0">取消分排</button>':'<span style="color:var(--mut)">請先點上面的學生</span>'}</div>
  </div>
  <div class="sec"><h3>⚙ 設定</h3>
    <div class="row">遲到時間：<button class="chip" id="lMinus">－5分</button><b style="font-size:26px">${settings.lateTime}</b><button class="chip" id="lPlus">＋5分</button>
    <span style="width:20px"></span><button class="chip ${settings.skip&&settings.skip[todayKey()]?'on':''}" id="skipDiary">📔 今天不用交聯絡簿</button><button class="chip ${settings.diaryOff?'':'on'}" id="diaryOn">每天自動收聯絡簿：${settings.diaryOff?'關':'開'}</button><span style="width:20px"></span><button class="btn gray" id="histBtn">📚 歷史作業</button><button class="btn gray" id="chgPin">改密碼</button><button class="btn gray" id="expCsv">匯出今日報到 CSV</button><button class="btn gray" id="clrAtt">清空今日報到</button><button class="btn red" id="lock">🔒 上鎖</button></div>
    <div style="margin-top:10px;color:var(--mut);font-size:17px">小提示：長按最上方任一標籤（約 1 秒），可用 ◀ ▶ 調整標籤順序，標籤不會消失。</div>
  </div>`;
  const A=$('#adminBody');
  A.querySelectorAll('[data-reopen]').forEach(b=>b.onclick=()=>db.ref('kiosk/collect/'+b.dataset.reopen).remove());
  A.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{
    if(b.dataset.armed){db.ref('kiosk/tasks/'+b.dataset.del).remove();db.ref('kiosk/checks/'+b.dataset.del).remove();db.ref('kiosk/status/'+b.dataset.del).remove();db.ref('kiosk/collect/'+b.dataset.del).remove()}
    else{b.dataset.armed=1;b.textContent='再按一次刪除'}
  });
  A.querySelectorAll('[data-unin]').forEach(b=>b.onclick=()=>{
    if(b.dataset.armed){db.ref('kiosk/attendance/'+curDay+'/'+b.dataset.unin).remove()}
    else{b.dataset.armed=1;b.style.outline='4px solid var(--bad)';b.querySelector('.tm').textContent='再按取消'}
  });
  A.querySelectorAll('[data-as]').forEach(b=>b.onclick=()=>{assignSel=assignSel===b.dataset.as?null:b.dataset.as;renderAdmin()});
  A.querySelectorAll('[data-sqset]').forEach(b=>b.onclick=()=>{
    const v=+b.dataset.sqset,r=db.ref('kiosk/squads/'+assignSel);v?r.set(v):r.remove();
    const i=students.findIndex(s=>s.key===assignSel);assignSel=students[i+1]?students[i+1].key:null;
  });
  $('#sqMinus').onclick=()=>db.ref('kiosk/settings/squadCount').set(Math.max(1,settings.squadCount-1));
  $('#sqPlus').onclick=()=>db.ref('kiosk/settings/squadCount').set(Math.min(12,settings.squadCount+1));
  const shift=m=>{let [h,mi]=settings.lateTime.split(':').map(Number);let t=h*60+mi+m;t=Math.max(0,Math.min(1439,t));db.ref('kiosk/settings/lateTime').set(pad2(Math.floor(t/60))+':'+pad2(t%60))};
  $('#lMinus').onclick=()=>shift(-5);$('#lPlus').onclick=()=>shift(5);
  $('#skipDiary').onclick=()=>{const r=db.ref('kiosk/settings/skip/'+todayKey());(settings.skip&&settings.skip[todayKey()])?r.remove():r.set(true)};
  $('#diaryOn').onclick=()=>{const r=db.ref('kiosk/settings/diaryOff');settings.diaryOff?r.remove():r.set(true)};
  const saveNotes=a=>{settings.notes=a;db.ref('kiosk/settings/notes').set(a);renderAdmin()};
  A.querySelectorAll('[data-nl]').forEach(b=>b.onclick=()=>{const a=noteList(),i=+b.dataset.nl;if(i>0){[a[i-1],a[i]]=[a[i],a[i-1]];saveNotes(a)}});
  A.querySelectorAll('[data-nr]').forEach(b=>b.onclick=()=>{const a=noteList(),i=+b.dataset.nr;if(i<a.length-1){[a[i+1],a[i]]=[a[i],a[i+1]];saveNotes(a)}});
  A.querySelectorAll('[data-nx]').forEach(b=>b.onclick=()=>{
    if(b.dataset.armed){const a=noteList();a.splice(+b.dataset.nx,1);a.length?saveNotes(a):(settings.notes=null,db.ref('kiosk/settings/notes').remove(),renderAdmin())}
    else{b.dataset.armed=1;b.textContent='再按刪除'}
  });
  $('#noteAdd').onclick=()=>{const v=$('#noteNew').value.trim();if(!v)return;const a=noteList();if(!a.includes(v))a.push(v);saveNotes(a)};
  $('#noteReset').onclick=function(){if(this.dataset.a){settings.notes=null;db.ref('kiosk/settings/notes').remove();renderAdmin()}else{this.dataset.a=1;this.textContent='再按一次確認'}};
  A.querySelectorAll('[data-mk]').forEach(b=>b.onclick=()=>openMk(b.dataset.mk));
  $('#histBtn').onclick=showHist;
  $('#chgPin').onclick=()=>askPin(null,'change');
  $('#lock').onclick=()=>{unlocked=false;showTab('checkin')};
  $('#clrAtt').onclick=function(){if(this.dataset.a){db.ref('kiosk/attendance/'+curDay).remove();this.textContent='清空今日報到';delete this.dataset.a}else{this.dataset.a=1;this.textContent='再按一次確認清空'}};
  $('#expCsv').onclick=()=>{
    const rows=[['座號','姓名','報到時間','狀態']].concat(students.map(s=>[s.no,s.name,att[s.key]?att[s.key].t:'',att[s.key]?(isLate(att[s.key].t)?'遲到':'準時'):(absn[s.key]?(absn[s.key].st==='public'?'公假':'請假'):'未到')]));
    const blob=new Blob(['﻿'+rows.map(r=>r.join(',')).join('\n')],{type:'text/csv'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='報到_'+curDay+'.csv';a.click();
  };
}
renderNav();
</script>
</body>
</html>
