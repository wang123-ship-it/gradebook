<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>703 班級報到站</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
:root{--bg:#f4f1ea;--card:#fff;--ink:#2b2a33;--mut:#7a7787;--pri:#3b7dd8;--ok:#2e9e6b;--okbg:#dff5e9;--late:#e67e22;--latebg:#fdebd3;--bad:#d9534f;--line:#e2ddd0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;touch-action:manipulation}
body{display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;gap:14px;padding:10px 18px;background:#fff;border-bottom:2px solid var(--line)}
#clock{font-size:40px;font-weight:800;font-variant-numeric:tabular-nums;min-width:130px}
#dateTxt{font-size:18px;color:var(--mut);line-height:1.3}
nav{display:flex;gap:6px;margin-left:auto;align-items:center;overflow-x:auto}
nav button{font-size:20px;font-weight:700;padding:12px 13px;border:0;border-radius:16px;background:#ece8dc;color:var(--ink);min-height:60px;white-space:nowrap;flex-shrink:0}
nav .mv{display:flex;gap:4px;background:#fff3c4;border-radius:20px;padding:4px;flex-shrink:0}
nav .arr{background:#fff;min-width:54px;padding:12px 8px}nav .arr.ok{background:var(--ok);color:#fff}nav .arr:disabled{opacity:.3}
nav button.on{background:var(--pri);color:#fff}
#sync{width:12px;height:12px;border-radius:50%;background:#bbb}
#sync.ok{background:var(--ok)}
main{flex:1;overflow:auto;padding:14px 18px;-webkit-overflow-scrolling:touch}
.panel{display:none}.panel.on{display:block}
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.stat{font-size:24px;font-weight:800}
.stat small{font-size:16px;color:var(--mut);font-weight:500;margin-left:6px}
.chip{display:inline-flex;align-items:center;justify-content:center;font-size:21px;font-weight:700;padding:12px 20px;min-height:56px;border-radius:28px;border:2px solid var(--line);background:#fff;color:var(--ink)}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
.btn{font-size:22px;font-weight:700;padding:14px 24px;min-height:60px;border:0;border-radius:16px;background:var(--pri);color:#fff}
.btn.gray{background:#ddd8ca;color:var(--ink)}.btn.red{background:var(--bad)}.btn.green{background:var(--ok)}
.btn:active,.chip:active,.tile:active,.cell:active{transform:scale(.96)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{position:relative;min-height:92px;border-radius:18px;border:3px solid var(--line);background:#fff;padding:8px 6px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:26px;font-weight:800}
.tile .no{font-size:15px;color:var(--mut);font-weight:600}
.tile .tm{font-size:17px;font-weight:700;margin-top:2px}
.tile.in{background:var(--okbg);border-color:var(--ok)}
.tile.late{background:var(--latebg);border-color:var(--late)}
.tile.late .tm{color:var(--late)}
.tile.in .tm{color:var(--ok)}
.tile .seq{position:absolute;top:4px;right:8px;font-size:14px;color:var(--mut);font-weight:700}
.tile .medal{position:absolute;top:2px;left:6px;font-size:20px}
.hwwrap{}
table.hw{border-collapse:separate;border-spacing:6px;width:100%}
table.hw th{position:sticky;top:0;z-index:3;background:var(--bg);font-size:17px;font-weight:700;padding:6px;vertical-align:bottom}
table.hw th .sub{display:block;font-size:13px;color:var(--mut);font-weight:500}
table.hw td.nm{font-size:23px;font-weight:800;white-space:nowrap;padding:0 10px;background:#fff;border-radius:12px;min-width:150px;width:1%}
table.hw td.nm small{color:var(--mut);font-weight:600;font-size:14px;margin-right:6px}
table.hw tr.sq td.sqh{background:#dfe9f8;border-radius:12px;font-size:20px;font-weight:800;padding:8px 14px}
.cell{height:68px;min-width:92px;border-radius:14px;border:3px solid var(--line);background:#fff;font-size:30px;font-weight:800;color:#c9c5b8;width:100%}
.cell.y{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.cell.absent{background:#eee;color:#bbb}
.nodata{padding:50px;text-align:center;color:var(--mut);font-size:22px}
.modal{position:fixed;inset:0;background:rgba(30,28,40,.55);display:none;align-items:center;justify-content:center;z-index:50}
.modal.on{display:flex}
.box{background:#fff;border-radius:24px;padding:24px;max-width:92vw;max-height:90vh;overflow:auto;min-width:420px}
.box h2{margin:0 0 14px;font-size:28px}
.pad{display:grid;grid-template-columns:repeat(3,92px);gap:10px;justify-content:center}
.pad button{height:80px;font-size:34px;font-weight:800;border:0;border-radius:18px;background:#ece8dc}
#pinDots{text-align:center;font-size:44px;letter-spacing:12px;height:60px;margin-bottom:8px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#2b2a33;color:#fff;padding:14px 24px;border-radius:30px;font-size:22px;display:none;z-index:60;align-items:center;gap:16px}
.toast.on{display:flex}
.toast button{background:#fff;color:#2b2a33;border:0;border-radius:18px;padding:8px 18px;font-size:18px;font-weight:700}
.sec{background:#fff;border-radius:18px;padding:16px;margin-bottom:14px}
.sec h3{margin:0 0 10px;font-size:22px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
input.txt{font-size:22px;padding:12px 14px;border:2px solid var(--line);border-radius:12px;min-width:260px;user-select:text;-webkit-user-select:text}
.tasklist .it{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:20px}
.tasklist .it b{flex:1}
.tool{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:900px){.tool{grid-template-columns:1fr}}
#pick{font-size:72px;font-weight:900;text-align:center;min-height:110px;line-height:110px;color:var(--pri)}
#tcount{font-size:96px;font-weight:900;text-align:center;font-variant-numeric:tabular-nums;line-height:1.1}
#tcount.end{color:var(--bad)}
.sqbtns{display:flex;gap:6px;flex-wrap:wrap}
.sqbtns .chip{min-height:48px;padding:8px 16px;font-size:20px}
button.tile.done{cursor:default}button.tile.done:active{transform:none}
.bkday{margin-bottom:16px}.bkday h3{margin:0 0 8px;font-size:24px}.bkday h3 small{color:var(--mut);font-weight:600;font-size:18px;margin-left:8px}
.bkgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.bk{display:flex;align-items:center;gap:12px;background:#fff;border:3px solid var(--line);border-radius:18px;padding:12px 14px}
.bks{width:62px;height:62px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:900;color:#fff;flex-shrink:0}
.bkt{font-size:26px;font-weight:800}.bkn{font-size:18px;color:var(--mut)}
.lt{background:#fff;border:3px solid var(--late);border-radius:18px;padding:14px;margin-bottom:12px}
.lt h3{margin:0 0 10px;font-size:24px}.lt h3 small{color:var(--late);font-size:18px;margin-left:8px}
.nm2{display:inline-block;margin:4px;padding:10px 16px;border-radius:14px;background:var(--latebg);font-size:26px;font-weight:800}
.nm2 small{font-size:14px;color:var(--mut);margin-left:4px}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:70}
</style>
</head>
<body>
<header>
  <div id="clock">--:--</div>
  <div id="dateTxt"></div>
  <span id="sync" title="連線狀態"></span>
  <nav id="nav"></nav>
</header>
<main>
  <!-- 報到 -->
  <section class="panel on" id="p-checkin">
    <div class="bar">
      <div class="stat" id="stIn">已到 0<small>/ 0</small></div>
      <div class="stat" id="stLate" style="color:var(--late)"></div>
      <div class="stat" id="stWait" style="font-size:18px;color:var(--mut);font-weight:600"></div>
    </div>
    <div class="grid" id="gCheck"></div>
  </section>
  <!-- 收作業 -->
  <section class="panel" id="p-hw">
    <div class="bar" id="hwFilter"></div>
    <div class="hwwrap" id="hwBody"></div>
  </section>
  <section class="panel" id="p-book"></section>
  <section class="panel" id="p-cadre"></section>
  <section class="panel" id="p-late"></section>
  <!-- 小工具 -->
  <section class="panel" id="p-tools">
    <div class="tool">
      <div class="sec">
        <h3>🎯 隨機點名</h3>
        <div class="row" style="margin-bottom:8px">
          <button class="chip on" id="pkIn">只抽已到的</button>
          <button class="chip" id="pkNo">不重複</button>
        </div>
        <div id="pick">？</div>
        <button class="btn" style="width:100%;font-size:30px;min-height:76px" id="pkGo">抽！</button>
      </div>
      <div class="sec">
        <h3>⏱ 倒數計時</h3>
        <div id="tcount">05:00</div>
        <div class="row" style="justify-content:center;margin:10px 0">
          <button class="chip" data-m="1">1分</button><button class="chip on" data-m="5">5分</button>
          <button class="chip" data-m="10">10分</button><button class="chip" data-m="15">15分</button>
          <button class="chip" data-m="30">30分</button>
        </div>
        <div class="row" style="justify-content:center">
          <button class="btn green" id="tGo">開始</button><button class="btn gray" id="tRst">重設</button>
        </div>
      </div>
    </div>
  </section>
  <!-- 老師 -->
  <section class="panel" id="p-admin"><div id="adminBody"></div></section>
</main>

<div class="modal" id="mPin"><div class="box" style="min-width:380px">
  <h2 id="pinTitle" style="text-align:center">輸入老師密碼</h2>
  <div id="pinDots"></div>
  <div class="pad" id="pinPad"></div>
  <div class="row" style="justify-content:center;margin-top:14px"><button class="btn gray" id="pinCancel">取消</button></div>
</div></div>
<div class="toast" id="toast"><span id="toastTxt"></span></div>
<div class="modal" id="mCf"><div class="box" style="text-align:center;min-width:460px">
  <div style="font-size:24px;color:var(--mut)">要報到的是</div>
  <div id="cfName" style="font-size:60px;font-weight:900;margin:6px 0"></div>
  <div id="cfSub" style="font-size:22px;color:var(--mut);margin-bottom:20px"></div>
  <div class="row" style="justify-content:center;gap:18px">
    <button class="btn gray" id="cfNo" style="font-size:30px;min-width:180px;min-height:88px">取消</button>
    <button class="btn green" id="cfYes" style="font-size:30px;min-width:180px;min-height:88px">✔ 確定</button>
  </div></div></div>
<canvas id="confetti"></canvas>

<script>
firebase.initializeApp({
  apiKey:"AIzaSyArjsk22SiVdkdzvySSgwkCDFBKrPp_MMM",
  authDomain:"class-book-red-703.firebaseapp.com",
  databaseURL:"https://class-book-red-703-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:"class-book-red-703"
});
const db=firebase.database();
const $=s=>document.querySelector(s);
const SUBJ=["國","英","數","自","地","歷","公","其他"];
const TYPES=["作業","訂正","小考","帶物品"];
const pad2=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
const todayKey=()=>ymd(new Date());
const WD=['日','一','二','三','四','五','六'];
function nextSchoolDay(from){const d=new Date(from||Date.now());do{d.setDate(d.getDate()+1)}while(d.getDay()==0||d.getDay()==6);return ymd(d)}
function prevSchoolDay(){const d=new Date();do{d.setDate(d.getDate()-1)}while(d.getDay()==0||d.getDay()==6);return ymd(d)}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

let students=[],settings={lateTime:'07:40',squadCount:6},squads={},att={},tasks={},checks={};
let hwSquad='all',hwMode='all',picked=new Set(),pickIn=true,pickNoRep=false;
let unlocked=false,curDay=todayKey();

/* ---------- 資料監聽 ---------- */
db.ref('students').on('value',s=>{
  const v=s.val()||{};
  students=Object.keys(v).map(k=>({key:k,no:+v[k].no||0,name:v[k].name||'',arch:!!v[k].archived})).filter(x=>!x.arch&&x.name).sort((a,b)=>a.no-b.no);
  renderAll();
});
db.ref('kiosk/settings').on('value',s=>{settings=Object.assign({lateTime:'07:40',squadCount:6},s.val()||{});renderAll()});
db.ref('kiosk/squads').on('value',s=>{squads=s.val()||{};renderAll()});
db.ref('kiosk/tasks').on('value',s=>{tasks=s.val()||{};renderAll()});
db.ref('kiosk/checks').on('value',s=>{checks=s.val()||{};renderHw();if(unlocked)renderAdmin()});
let attRef=null;
function watchAtt(){
  if(attRef)attRef.off();
  curDay=todayKey();
  attRef=db.ref('kiosk/attendance/'+curDay);
  attRef.on('value',s=>{att=s.val()||{};renderCheckin();if(unlocked)renderAdmin()});
}
watchAtt();
db.ref('.info/connected').on('value',s=>$('#sync').classList.toggle('ok',!!s.val()));

/* ---------- 時鐘 ---------- */
function tick(){
  const d=new Date();
  $('#clock').textContent=pad2(d.getHours())+':'+pad2(d.getMinutes());
  $('#dateTxt').innerHTML=(d.getMonth()+1)+'月'+d.getDate()+'日<br>星期'+WD[d.getDay()];
  if(ymd(d)!==curDay){watchAtt();renderAll()}
}
setInterval(tick,5000);tick();

/* ---------- 分頁 ---------- */
const TABS={checkin:'🌅 報到',hw:'📚 收作業',book:'📒 聯絡簿',cadre:'🧑‍✈️ 幹部',late:'⚠️ 遲交',tools:'🎲 小工具',admin:'🔒 老師'};
const DEF_ORDER=['checkin','book','cadre','hw','late','tools','admin'];
let curTab='checkin',moveTab=null,lpFlag=false,lpTimer=null;
function tabOrder(){const o=(Array.isArray(settings.tabOrder)?settings.tabOrder.slice():[]).filter((t,i,a)=>TABS[t]&&a.indexOf(t)===i);DEF_ORDER.forEach(t=>{if(!o.includes(t))o.push(t)});return o}
function renderNav(){
  const o=tabOrder();let h='';
  o.forEach((t,i)=>{
    if(moveTab===t)h+=`<span class="mv"><button class="arr" data-mv="-1" ${i==0?'disabled':''}>◀</button><button class="on" data-tab="${t}">${TABS[t]}</button><button class="arr" data-mv="1" ${i==o.length-1?'disabled':''}>▶</button><button class="arr ok" data-mvdone="1">✓</button></span>`;
    else h+=`<button data-tab="${t}" class="${curTab===t?'on':''}">${TABS[t]}</button>`;
  });
  const nav=$('#nav');nav.innerHTML=h;
  nav.querySelectorAll('[data-tab]').forEach(b=>{
    const t=b.dataset.tab;
    b.onclick=()=>{
      if(lpFlag||moveTab)return;
      if(t==='admin'&&!unlocked){askPin(()=>showTab('admin'));return}
      showTab(t);
    };
    b.onpointerdown=()=>{clearTimeout(lpTimer);lpTimer=setTimeout(()=>{lpFlag=true;startMove(t)},700)};
    b.onpointerleave=b.onpointercancel=()=>clearTimeout(lpTimer);
  });
  nav.querySelectorAll('[data-mv]').forEach(b=>b.onclick=()=>{
    const o2=tabOrder(),i=o2.indexOf(moveTab),j=i+(+b.dataset.mv);
    if(j<0||j>=o2.length)return;
    [o2[i],o2[j]]=[o2[j],o2[i]];settings.tabOrder=o2;db.ref('kiosk/settings/tabOrder').set(o2);renderNav();
  });
  const dn=nav.querySelector('[data-mvdone]');if(dn)dn.onclick=()=>{moveTab=null;renderNav()};
}
document.addEventListener('pointerup',()=>{clearTimeout(lpTimer);setTimeout(()=>lpFlag=false,80)});
function startMove(t){
  if(!unlocked){askPin(()=>{moveTab=t;renderNav()});return}
  moveTab=t;renderNav();
}
function showTab(t){
  curTab=t;
  document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('on',p.id==='p-'+t));
  renderNav();
  if(t==='admin')renderAdmin();
  if(t==='hw')renderHw();
  if(t==='tools')renderTools();
  renderBook();renderCadre();renderLate();
}
function renderAll(){renderNav();renderCheckin();renderHw();renderTools();renderBook();renderCadre();renderLate();if(unlocked)renderAdmin()}

/* ---------- 報到 ---------- */
function isLate(t){return t>settings.lateTime}
function renderCheckin(){
  const g=$('#gCheck');
  if(!students.length){g.innerHTML='<div class="nodata">讀取學生名單中⋯</div>';return}
  const order=Object.keys(att).sort((a,b)=>att[a].ts-att[b].ts);
  const seq={};order.forEach((k,i)=>seq[k]=i+1);
  let late=0;
  g.innerHTML=students.map(s=>{
    const a=att[s.key];
    if(!a)return `<button class="tile" data-k="${s.key}"><span class="no">${s.no}</span>${esc(s.name)}</button>`;
    const l=isLate(a.t);if(l)late++;
    const medal=seq[s.key]<=3?['🥇','🥈','🥉'][seq[s.key]-1]:'';
    return `<button class="tile in done ${l?'late':''}" data-k="${s.key}"><span class="medal">${medal}</span><span class="seq">第${seq[s.key]}位</span><span class="no">${s.no}</span>${esc(s.name)}<span class="tm">${a.t}${l?' 遲':''}</span></button>`;
  }).join('');
  const n=order.filter(k=>students.some(s=>s.key===k)).length;
  $('#stIn').innerHTML=`已到 ${n}<small>/ ${students.length}</small>`;
  $('#stLate').textContent=late?`遲到 ${late}`:'';
  const miss=students.filter(s=>!att[s.key]);
  $('#stWait').textContent=miss.length&&miss.length<=6?'還沒到：'+miss.map(s=>s.name).join('、'):'';
  g.querySelectorAll('.tile').forEach(b=>b.onclick=()=>tapCheck(b.dataset.k));
}
let cfKey=null;
function tapCheck(k){
  if(att[k])return; // 已報到不可再點
  const s=students.find(x=>x.key===k);if(!s)return;
  cfKey=k;
  const d=new Date();
  $('#cfName').textContent=s.name;
  $('#cfSub').textContent='座號 '+s.no+'　現在 '+pad2(d.getHours())+':'+pad2(d.getMinutes());
  $('#mCf').classList.add('on');
}
$('#cfNo').onclick=()=>{cfKey=null;$('#mCf').classList.remove('on')};
$('#cfYes').onclick=()=>{
  const k=cfKey;cfKey=null;$('#mCf').classList.remove('on');
  const s=students.find(x=>x.key===k);
  if(!s||att[k])return;
  const d=new Date(),t=pad2(d.getHours())+':'+pad2(d.getMinutes());
  db.ref('kiosk/attendance/'+curDay+'/'+k).set({t,ts:d.getTime()});
  const late=isLate(t);
  toast((late?'⏰ ':'✅ ')+s.name+' '+t+(late?'（遲到）':' 報到成功'));
  setTimeout(()=>{if(Object.keys(att).length>=students.length&&students.length)boom()},400);
};
let tt;function toast(m){
  $('#toastTxt').textContent=m;
  $('#toast').classList.add('on');clearTimeout(tt);tt=setTimeout(()=>$('#toast').classList.remove('on'),3500);
}

/* ---------- 收作業 ---------- */
function openTasks(){
  return Object.keys(tasks).map(id=>Object.assign({id},tasks[id])).filter(t=>!t.closed).sort((a,b)=>(a.due||'').localeCompare(b.due||'')||a.createdAt-b.createdAt);
}
function sqOf(k){return squads[k]||0}
function renderHw(){
  const T=openTasks();
  const fil=['all',...Array.from({length:settings.squadCount},(_,i)=>i+1),0];
  $('#hwFilter').innerHTML=
    fil.map(f=>`<button class="chip ${hwSquad===f?'on':''}" data-sq="${f}">${f==='all'?'全班':f===0?'未分排':'第'+f+'排'}</button>`).join('')+
    `<span style="width:16px"></span><button class="chip ${hwMode==='miss'?'on':''}" id="hwMiss">只看還沒交</button>`;
  $('#hwFilter').querySelectorAll('[data-sq]').forEach(b=>b.onclick=()=>{hwSquad=b.dataset.sq==='all'?'all':+b.dataset.sq;renderHw()});
  $('#hwMiss').onclick=()=>{hwMode=hwMode==='miss'?'all':'miss';renderHw()};
  const body=$('#hwBody');
  if(!T.length){body.innerHTML='<div class="nodata">目前沒有要收的項目 🎉<br><small>老師在「🔒 老師」新增作業</small></div>';return}
  let list=students.filter(s=>hwSquad==='all'||sqOf(s.key)===hwSquad);
  if(hwMode==='miss')list=list.filter(s=>T.some(t=>!(checks[t.id]||{})[s.key]&&!att.__none));
  let h='<table class="hw"><thead><tr><th></th>'+T.map(t=>{
    const done=students.filter(s=>(checks[t.id]||{})[s.key]).length;
    return `<th>${esc(t.subj)}${esc(t.type)}<span class="sub">${esc(t.note||'')}${t.due?' 交'+t.due.slice(5).replace('-','/'):''}</span><span class="sub">${done}/${students.length}</span></th>`}).join('')+'</tr></thead><tbody>';
  let lastSq=null;
  list.forEach(s=>{
    const q=sqOf(s.key);
    if(hwSquad==='all'&&q!==lastSq){lastSq=q;
      const mem=students.filter(x=>sqOf(x.key)===q);
      h+=`<tr class="sq"><td class="sqh" colspan="${T.length+1}">${q?'第'+q+'排':'未分排'}　<small style="font-weight:500">${T.map(t=>esc(t.subj+t.type)+' '+mem.filter(x=>(checks[t.id]||{})[x.key]).length+'/'+mem.length).join('　')}</small></td></tr>`}
    const away=!att[s.key];
    h+=`<tr><td class="nm"><small>${s.no}</small>${esc(s.name)}${away?' <small>（未到）</small>':''}</td>`+T.map(t=>{
      const y=(checks[t.id]||{})[s.key];
      return `<td><button class="cell ${y?'y':''}${away&&!y?' absent':''}" data-t="${t.id}" data-k="${s.key}">${y?'✓':'○'}</button></td>`}).join('')+'</tr>';
  });
  body.innerHTML=h+'</tbody></table>';
  body.querySelectorAll('.cell').forEach(c=>c.onclick=()=>{
    const r=db.ref('kiosk/checks/'+c.dataset.t+'/'+c.dataset.k);
    (checks[c.dataset.t]||{})[c.dataset.k]?r.remove():r.set(true);
  });
}

/* ---------- 小工具 ---------- */
$('#pkIn').onclick=()=>{pickIn=!pickIn;renderTools()};
$('#pkNo').onclick=()=>{pickNoRep=!pickNoRep;if(!pickNoRep)picked.clear();renderTools()};
function renderTools(){
  $('#pkIn').classList.toggle('on',pickIn);$('#pkNo').classList.toggle('on',pickNoRep);
}
$('#pkGo').onclick=()=>{
  let pool=students.filter(s=>(!pickIn||att[s.key])&&(!pickNoRep||!picked.has(s.key)));
  if(!pool.length){if(pickNoRep&&picked.size){picked.clear();toast('全部抽過了，重新開始');}else toast('沒有可抽的人');return}
  let n=0;const el=$('#pick');
  const iv=setInterval(()=>{el.textContent=pool[Math.floor(Math.random()*pool.length)].name;
    if(++n>=18){clearInterval(iv);const w=pool[Math.floor(Math.random()*pool.length)];el.textContent=w.name;picked.add(w.key);beep(880,.15)}},70);
};
let tMin=5,tLeft=300,tIv=null;
function showT(){const m=Math.floor(tLeft/60),s=tLeft%60;const e=$('#tcount');e.textContent=pad2(m)+':'+pad2(s);e.classList.toggle('end',tLeft<=10&&tLeft>=0&&!!tIv)}
document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('[data-m]').forEach(x=>x.classList.toggle('on',x===b));
  tMin=+b.dataset.m;stopT();tLeft=tMin*60;showT();
});
function stopT(){clearInterval(tIv);tIv=null;$('#tGo').textContent='開始'}
$('#tGo').onclick=()=>{
  if(tIv){stopT();return}
  if(tLeft<=0)tLeft=tMin*60;
  $('#tGo').textContent='暫停';
  tIv=setInterval(()=>{tLeft--;showT();if(tLeft<=0){stopT();beep(660,.5);setTimeout(()=>beep(880,.5),600);setTimeout(()=>beep(1040,.8),1200)}},1000);
};
$('#tRst').onclick=()=>{stopT();tLeft=tMin*60;showT()};
let ac;function beep(f,d){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;o.connect(g);g.connect(ac.destination);g.gain.setValueAtTime(.3,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.start();o.stop(ac.currentTime+d)}catch(e){}}

/* ---------- 彩帶 ---------- */
function boom(){
  const c=$('#confetti'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;
  const P=Array.from({length:140},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,vx:(Math.random()-.5)*3,vy:2+Math.random()*4,s:6+Math.random()*8,c:`hsl(${Math.random()*360},80%,60%)`}));
  let f=0;(function a(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;x.fillStyle=p.c;x.fillRect(p.x,p.y,p.s,p.s*.6)});if(++f<200)requestAnimationFrame(a);else x.clearRect(0,0,c.width,c.height)})();
  toast('🎉 全班到齊！');beep(1040,.4);
}

/* ---------- PIN ---------- */
async function sha(s){
  try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('703kiosk:'+s));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('')}
  catch(e){let h=5381;for(const ch of '703kiosk:'+s)h=((h<<5)+h+ch.charCodeAt(0))>>>0;return 'x'+h}
}
let pinBuf='',pinCb=null,pinMode='enter',pinFirst='';
function askPin(cb,mode){
  pinCb=cb;pinBuf='';pinFirst='';
  pinMode=mode||(settings.pinHash?'enter':'new');
  $('#pinTitle').textContent=pinMode==='enter'?'輸入老師密碼':'設定 4 位數密碼';
  drawPin();$('#mPin').classList.add('on');
}
function drawPin(){$('#pinDots').textContent='●'.repeat(pinBuf.length)+'○'.repeat(Math.max(0,4-pinBuf.length))}
$('#pinPad').innerHTML=[1,2,3,4,5,6,7,8,9,'⌫',0,'OK'].map(k=>`<button data-k="${k}">${k}</button>`).join('');
$('#pinPad').querySelectorAll('button').forEach(b=>b.onclick=async()=>{
  const k=b.dataset.k;
  if(k==='⌫'){pinBuf=pinBuf.slice(0,-1);drawPin();return}
  if(k!=='OK'){if(pinBuf.length<4)pinBuf+=k;drawPin();if(pinBuf.length<4)return}
  if(pinBuf.length<4)return;
  if(pinMode==='enter'){
    if(await sha(pinBuf)===settings.pinHash){unlocked=true;closePin();pinCb&&pinCb()}
    else{$('#pinTitle').textContent='密碼錯誤，再試一次';pinBuf='';drawPin()}
  }else if(pinMode==='new'||pinMode==='change'){
    pinFirst=pinBuf;pinBuf='';pinMode='confirm';$('#pinTitle').textContent='再輸入一次確認';drawPin();
  }else if(pinMode==='confirm'){
    if(pinBuf===pinFirst){await db.ref('kiosk/settings/pinHash').set(await sha(pinBuf));unlocked=true;closePin();toast('密碼已設定');pinCb&&pinCb()}
    else{pinMode='new';pinBuf='';pinFirst='';$('#pinTitle').textContent='兩次不同，重新設定';drawPin()}
  }
});
function closePin(){$('#mPin').classList.remove('on')}
$('#pinCancel').onclick=closePin;

/* ---------- 老師區 ---------- */
const SCOLOR={國:'#e0525e',英:'#3b7dd8',數:'#2e9e6b',自:'#8e5bd1',地:'#d98a1f',歷:'#a0643c',公:'#15a0a8',其他:'#7a7787'};
const NOTES=['習作','學習單','考卷','課本','筆記本'];
let nt={subj:'國',type:'作業',due:null,note:''},assignSel=null;
function dayLabel(d){
  const t=new Date(todayKey()+'T00:00:00'),x=new Date(d+'T00:00:00'),n=Math.round((x-t)/864e5);
  const w='(週'+WD[x.getDay()]+')',md=(x.getMonth()+1)+'/'+x.getDate();
  const nm=n===0?'今天':n===1?'明天':n===2?'後天':'';
  return `${md} ${w}<small>${nm}</small>`;
}
function bookHtml(){
  const td=todayKey();
  const T=openTasks().filter(t=>!t.due||t.due>=td);
  if(!T.length)return '<div class="nodata">目前沒有登記的聯絡簿 🎉</div>';
  const g={};T.forEach(t=>(g[t.due||'9999']=g[t.due||'9999']||[]).push(t));
  return Object.keys(g).sort().map(d=>`<div class="bkday"><h3>${d==='9999'?'未訂日期':dayLabel(d)}<small>繳交</small></h3><div class="bkgrid">${g[d].map(t=>`<div class="bk"><div class="bks" style="background:${SCOLOR[t.subj]||'#7a7787'}">${esc(t.subj.slice(0,1))}</div><div><div class="bkt">${esc(t.subj==='其他'?'':t.subj)}${esc(t.type)}</div><div class="bkn">${esc(t.note||'')}</div></div></div>`).join('')}</div></div>`).join('');
}
function renderBook(){
  if(curTab!=='book')return;
  $('#p-book').innerHTML=bookHtml();
}
function renderLate(){
  if(curTab!=='late')return;
  const td=todayKey(),T=openTasks().filter(t=>t.due&&t.due<td);
  let items=0,ppl=0,h='';
  T.forEach(t=>{
    const miss=students.filter(s=>!(checks[t.id]||{})[s.key]);
    if(!miss.length)return;
    items++;ppl+=miss.length;
    const days=Math.round((new Date(td+'T00:00:00')-new Date(t.due+'T00:00:00'))/864e5);
    h+=`<div class="lt"><h3>${esc(t.subj==='其他'?'':t.subj)}${esc(t.type)} <small>${esc(t.note||'')}　應交 ${t.due.slice(5).replace('-','/')}　已逾 ${days} 天　尚缺 ${miss.length} 人</small></h3>${miss.map(s=>`<span class="nm2">${esc(s.name)}${att[s.key]?'':'<small>未到</small>'}</span>`).join('')}</div>`;
  });
  $('#p-late').innerHTML=items?`<div class="bar"><div class="stat" style="color:var(--late)">遲交 ${items} 項<small>共 ${ppl} 人次</small></div></div>`+h:'<div class="nodata">沒有遲交的作業或物品 👏</div>';
}
function renderCadre(){
  if(curTab!=='cadre')return;
  if(document.activeElement&&document.activeElement.id==='ntNote')return;
  if(!nt.due)nt.due=todayKey();
  const nsd=nextSchoolDay(),tdy=todayKey();
  const chips=(arr,key)=>arr.map(v=>`<button class="chip ${nt[key]===v?'on':''}" data-nt="${key}" data-v="${v}">${v}</button>`).join('');
  $('#p-cadre').innerHTML=`
  <div class="sec"><h3>➕ 新增聯絡簿（點選即可，免打字）</h3>
    <div class="row" style="margin-bottom:8px">科目：${chips(SUBJ,'subj')}</div>
    <div class="row" style="margin-bottom:8px">類型：${chips(TYPES,'type')}</div>
    <div class="row" style="margin-bottom:8px">繳交日：
      <button class="chip ${nt.due===tdy?'on':''}" data-due="${tdy}">今天</button>
      <button class="chip ${nt.due===nsd?'on':''}" data-due="${nsd}">下個上學日 ${nsd.slice(5).replace('-','/')}</button>
      <input type="date" class="txt" id="ntDate" value="${nt.due}" style="min-width:0">
    </div>
    <div class="row" style="margin-bottom:12px">備註：${NOTES.map(v=>`<button class="chip ${nt.note===v?'on':''}" data-note="${v}">${v}</button>`).join('')}
      <input class="txt" id="ntNote" placeholder="或自己打(選填)" value="${esc(nt.note)}" style="min-width:200px"></div>
    <button class="btn green" id="ntAdd">新增「${nt.subj==='其他'?'':nt.subj}${nt.type}」</button>
  </div>
  <div class="sec"><h3>📒 新增後的樣子（聯絡簿）</h3>${bookHtml()}</div>`;
  const A=$('#p-cadre');
  A.querySelectorAll('[data-nt]').forEach(b=>b.onclick=()=>{nt[b.dataset.nt]=b.dataset.v;renderCadre()});
  A.querySelectorAll('[data-due]').forEach(b=>b.onclick=()=>{nt.due=b.dataset.due;renderCadre()});
  A.querySelectorAll('[data-note]').forEach(b=>b.onclick=()=>{nt.note=nt.note===b.dataset.note?'':b.dataset.note;renderCadre()});
  $('#ntDate').onchange=e=>{nt.due=e.target.value;renderCadre()};
  $('#ntNote').oninput=e=>nt.note=e.target.value;
  $('#ntAdd').onclick=()=>{
    nt.note=$('#ntNote').value.trim();
    db.ref('kiosk/tasks').push({subj:nt.subj,type:nt.type,due:nt.due,note:nt.note,createdAt:Date.now(),closed:false});
    toast('已新增 '+(nt.subj==='其他'?'':nt.subj)+nt.type);nt.note='';
  };
}

function renderAdmin(){
  if(!unlocked||curTab!=='admin'){return}
  const T=Object.keys(tasks).map(id=>Object.assign({id},tasks[id])).sort((a,b)=>b.createdAt-a.createdAt);
  const inList=students.filter(s=>att[s.key]);
  $('#adminBody').innerHTML=`
  <div class="sec"><h3>📋 項目管理（結案／刪除；新增請到「幹部」）</h3><div class="tasklist">${T.length?T.map(t=>{
    const done=students.filter(s=>(checks[t.id]||{})[s.key]).length;
    return `<div class="it"><b>${esc(t.subj)}${esc(t.type)} <small style="color:var(--mut);font-weight:500">${esc(t.note||'')} 交${(t.due||'').slice(5)}　${done}/${students.length}${t.closed?'　（已結案）':''}</small></b>
    <button class="chip" data-close="${t.id}">${t.closed?'重新開啟':'收齊結案'}</button><button class="chip" data-del="${t.id}" style="color:var(--bad)">刪除</button></div>`}).join(''):'<div class="nodata" style="padding:14px">尚無項目</div>'}</div></div>
  <div class="sec"><h3>🛠 更正報到（點一下，再按一次確認取消該生報到）</h3>
    <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(120px,1fr))">${inList.length?inList.map(s=>`<button class="tile in" style="min-height:64px;font-size:20px" data-unin="${s.key}">${esc(s.name)}<span class="tm" style="font-size:14px">${att[s.key].t}</span></button>`).join(''):'<span style="color:var(--mut)">今天還沒有人報到</span>'}</div></div>
  <div class="sec"><h3>👥 排別設定（先點學生，再點排別）</h3>
    <div class="row" style="margin-bottom:8px">排數：
      <button class="chip" id="sqMinus">－</button><b style="font-size:24px">${settings.squadCount}</b><button class="chip" id="sqPlus">＋</button></div>
    <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(130px,1fr))">${students.map(s=>`<button class="tile ${assignSel===s.key?'in':''}" style="min-height:72px;font-size:21px" data-as="${s.key}"><span class="no">${s.no}・${sqOf(s.key)?'第'+sqOf(s.key)+'排':'未分'}</span>${esc(s.name)}</button>`).join('')}</div>
    <div class="sqbtns" style="margin-top:10px">${assignSel?Array.from({length:settings.squadCount},(_,i)=>`<button class="chip" data-sqset="${i+1}">第${i+1}排</button>`).join('')+'<button class="chip" data-sqset="0">取消分排</button>':'<span style="color:var(--mut)">請先點上面的學生</span>'}</div>
  </div>
  <div class="sec"><h3>⚙ 設定</h3>
    <div class="row">遲到時間：<button class="chip" id="lMinus">－5分</button><b style="font-size:26px">${settings.lateTime}</b><button class="chip" id="lPlus">＋5分</button>
    <span style="width:20px"></span><button class="btn gray" id="chgPin">改密碼</button><button class="btn gray" id="expCsv">匯出今日報到 CSV</button><button class="btn gray" id="clrAtt">清空今日報到</button><button class="btn red" id="lock">🔒 上鎖</button></div>
    <div style="margin-top:10px;color:var(--mut);font-size:17px">小提示：長按最上方任一標籤（約 1 秒），可用 ◀ ▶ 調整標籤順序，標籤不會消失。</div>
  </div>`;
  const A=$('#adminBody');
  A.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>db.ref('kiosk/tasks/'+b.dataset.close+'/closed').set(!tasks[b.dataset.close].closed));
  A.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{
    if(b.dataset.armed){db.ref('kiosk/tasks/'+b.dataset.del).remove();db.ref('kiosk/checks/'+b.dataset.del).remove()}
    else{b.dataset.armed=1;b.textContent='再按一次刪除'}
  });
  A.querySelectorAll('[data-unin]').forEach(b=>b.onclick=()=>{
    if(b.dataset.armed){db.ref('kiosk/attendance/'+curDay+'/'+b.dataset.unin).remove()}
    else{b.dataset.armed=1;b.style.outline='4px solid var(--bad)';b.querySelector('.tm').textContent='再按取消'}
  });
  A.querySelectorAll('[data-as]').forEach(b=>b.onclick=()=>{assignSel=assignSel===b.dataset.as?null:b.dataset.as;renderAdmin()});
  A.querySelectorAll('[data-sqset]').forEach(b=>b.onclick=()=>{
    const v=+b.dataset.sqset,r=db.ref('kiosk/squads/'+assignSel);v?r.set(v):r.remove();
    const i=students.findIndex(s=>s.key===assignSel);assignSel=students[i+1]?students[i+1].key:null;
  });
  $('#sqMinus').onclick=()=>db.ref('kiosk/settings/squadCount').set(Math.max(1,settings.squadCount-1));
  $('#sqPlus').onclick=()=>db.ref('kiosk/settings/squadCount').set(Math.min(12,settings.squadCount+1));
  const shift=m=>{let [h,mi]=settings.lateTime.split(':').map(Number);let t=h*60+mi+m;t=Math.max(0,Math.min(1439,t));db.ref('kiosk/settings/lateTime').set(pad2(Math.floor(t/60))+':'+pad2(t%60))};
  $('#lMinus').onclick=()=>shift(-5);$('#lPlus').onclick=()=>shift(5);
  $('#chgPin').onclick=()=>askPin(null,'change');
  $('#lock').onclick=()=>{unlocked=false;showTab('checkin')};
  $('#clrAtt').onclick=function(){if(this.dataset.a){db.ref('kiosk/attendance/'+curDay).remove();this.textContent='清空今日報到';delete this.dataset.a}else{this.dataset.a=1;this.textContent='再按一次確認清空'}};
  $('#expCsv').onclick=()=>{
    const rows=[['座號','姓名','報到時間','是否遲到']].concat(students.map(s=>[s.no,s.name,att[s.key]?att[s.key].t:'',att[s.key]?(isLate(att[s.key].t)?'遲到':''):'未到']));
    const blob=new Blob(['﻿'+rows.map(r=>r.join(',')).join('\n')],{type:'text/csv'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='報到_'+curDay+'.csv';a.click();
  };
}
renderNav();
</script>
